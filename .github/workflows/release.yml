# Packages MountTrail and uploads it to CurseForge, Wago and GitHub Releases
# when a version tag is pushed (git tag v0.9.0-beta && git push origin
# v0.9.0-beta). A tag with "beta" or "alpha" in it is released as that.
# Secrets (repository Settings > Secrets and variables > Actions):
#   CF_API_KEY      CurseForge API token (needs X-Curse-Project-ID in the .toc)
#   WAGO_API_TOKEN  Wago Addons API token (needs X-Wago-ID in the .toc)
# GitHub Releases use the built-in token.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the tests first
        run: |
          python3 -m pip install --quiet lupa
          python3 tools/run_tests.py
      - uses: BigWigsMods/packager@v2
